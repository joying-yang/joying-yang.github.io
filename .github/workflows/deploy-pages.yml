name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate static site
        run: python3 tools/validate.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage public files
        run: |
          mkdir -p _site
          cp index.html 404.html robots.txt scene.js script.js site.webmanifest sitemap.xml styles.css _site/
          cp -R assets projects _site/
          touch _site/.nojekyll

      - name: Validate staged site
        run: python3 tools/validate.py --root _site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
